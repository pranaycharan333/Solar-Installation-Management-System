name: Forecast verification

on:
  push:
    paths:
      - "ml/demand_forecast/**"
      - ".github/workflows/forecast-checks.yml"
  pull_request:
    paths:
      - "ml/demand_forecast/**"
      - ".github/workflows/forecast-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/demand_forecast/requirements.txt
      - name: Install forecast dependencies
        run: python -m pip install -r ml/demand_forecast/service-requirements.txt
      - name: Run forecast behavior checks
        run: python -m unittest discover -s ml/demand_forecast/tests -v
      - name: Run evaluator demo
        run: python -m ml.demand_forecast.demo
